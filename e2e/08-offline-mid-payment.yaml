appId: de.zahln.student
name: The network drops as Pay is confirmed; the app waits, never says failed, and charges once
---
- runFlow:
    file: flows/sign-in.yaml
    env:
      USER: student
- runFlow: flows/open-new-order.yaml
- tapOn:
    id: "pay-confirm"
- runFlow: flows/set-pin-then-three-digits.yaml
- setAirplaneMode: enabled
- tapOn:
    id: "pin-4"
- extendedWaitUntil:
    visible: "Checking your payment"
    timeout: 60000
- assertNotVisible: "Paid"
- assertNotVisible: "Something went wrong. Nothing was charged."
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Paid"
    timeout: 180000
- runScript:
    file: scripts/api.js
    env:
      ACTION: assert_one_payment
      ORDER_ID: ${output.orderId}
