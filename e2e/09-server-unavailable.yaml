appId: de.zahln.student
name: The server answers 503 to every payment request; nothing is shown as failed and it charges once when it recovers
---
- runFlow:
    file: flows/sign-in.yaml
    env:
      USER: student
- openLink: "zahln://dev/faults?mode=fail_503"
- runFlow: flows/open-new-order.yaml
- tapOn:
    id: "pay-confirm"
- runFlow: flows/enter-pin.yaml
- runFlow: flows/enter-pin.yaml
- extendedWaitUntil:
    visible: "Checking your payment"
    timeout: 60000
- assertNotVisible: "Paid"
- assertNotVisible: "Something went wrong. Nothing was charged."
- openLink: "zahln://dev/faults?mode=off"
- openLink: "zahln://pay?order=${output.orderId}"
- extendedWaitUntil:
    visible: "Paid"
    timeout: 180000
- runScript:
    file: scripts/api.js
    env:
      ACTION: assert_one_payment
      ORDER_ID: ${output.orderId}
