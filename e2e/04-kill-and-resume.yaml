appId: de.zahln.student
name: Killing the app mid-payment resumes the same payment on relaunch
---
- runFlow:
    file: flows/sign-in.yaml
    env:
      USER: student
- openLink: "zahln://dev/faults?mode=lose_response"
- runFlow: flows/open-new-order.yaml
- tapOn:
    id: "pay-confirm"
- runFlow: flows/enter-pin.yaml
- runFlow: flows/enter-pin.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Paid"
    timeout: 120000
- runScript:
    file: scripts/api.js
    env:
      ACTION: assert_one_payment
      ORDER_ID: ${output.orderId}
